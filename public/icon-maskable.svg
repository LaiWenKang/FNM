      <path d="M32.4 46.6 C29.4 37.6 31.2 28 34 22 C35.3 19.2 38.2 19.5 39.4 22.2 L48.4 40 C49.6 42.7 47.7 45.8 44.9 45 Z" fill="url(#earin)"/>
    </g>
    <g transform="scale(-1,1) translate(-120,0)">
      <g transform="rotate(11 34.5 50.2)">
        <path d="M27 52 C22 39 24.5 24 29.2 14.5 C31.4 10 36.4 10.4 38.4 15 L53.5 43 C55.6 47.4 52.4 52.6 47.6 51.2 Z" fill="url(#coat)"/>
        <path d="M32.4 46.6 C29.4 37.6 31.2 28 34 22 C35.3 19.2 38.2 19.5 39.4 22.2 L48.4 40 C49.6 42.7 47.7 45.8 44.9 45 Z" fill="url(#earin)"/>
      </g>
    </g>

    <g transform="rotate(5 60 110)">
      <path d="M60 33 C78 33 96 42 101 60 C105 74 100 84 88 89 C82 91.5 78 92 75 93 C76.5 99 73 105 66 107.5 C64 108.2 62 108.5 60 108.5 C58 108.5 56 108.2 54 107.5 C47 105 43.5 99 45 93 C42 92 38 91.5 32 89 C20 84 15 74 19 60 C24 42 42 33 60 33 Z" fill="url(#coat)"/>
      <path d="M60 33 C78 33 96 42 101 60 C105 74 100 84 88 89 C82 91.5 78 92 75 93 C76.5 99 73 105 66 107.5 C64 108.2 62 108.5 60 108.5 C58 108.5 56 108.2 54 107.5 C47 105 43.5 99 45 93 C42 92 38 91.5 32 89 C20 84 15 74 19 60 C24 42 42 33 60 33 Z" fill="none" stroke="url(#rim)" stroke-width="2.9" stroke-linejoin="round"/>
      <path clip-path="url(#hd)" fill="#141824" d="M8 20 L112 20 L112 71 C104 81.5 94 85.5 82 84 C72 82.8 65 79.4 60 75.8 C55 79.4 48 82.8 38 84 C26 85.5 16 81.5 8 71 Z"/>
      <path fill="url(#blaze)" d="M60 36 L73.5 59.4 C70 60 67.6 61.8 66.6 65.2 C65.8 68 65.4 71 65.6 75 C66 80.5 73.4 84.5 74.8 92 C76.4 100.4 70 107.6 60 108 C50 107.6 43.6 100.4 45.2 92 C46.6 84.5 54 80.5 54.4 75 C54.6 71 54.2 68 53.4 65.2 C52.4 61.8 50 60 46.5 59.4 Z"/>

      <g transform="translate(74.6 70.5)">
        <path d="M0 -8.8 C4.6 -8.8 8.2 -4.9 8.2 0 C8.2 4.9 4.6 8.8 0 8.8 C-4.6 8.8 -8.2 4.9 -8.2 0 C-8.2 -4.9 -4.6 -8.8 0 -8.8 Z" fill="#F7F4EC"/>
        <g clip-path="url(#ec)">
          <circle r="7.7" fill="url(#iris)" stroke="#53D9FF" stroke-opacity=".55" stroke-width="1"/>
          <circle r="3.5" fill="#08111A"/>
          <circle cx="2.8" cy="-3.1" r="2.5" fill="#FFFFFF" opacity=".95"/>
        </g>
        <g clip-path="url(#ec)"><rect x="-9.4" y="-9.8" width="18.8" height="1.5" fill="#141824"/></g>
      </g>
      <g transform="translate(120,0) scale(-1,1) translate(74.6 70.5)">
        <path d="M0 -8.8 C4.6 -8.8 8.2 -4.9 8.2 0 C8.2 4.9 4.6 8.8 0 8.8 C-4.6 8.8 -8.2 4.9 -8.2 0 C-8.2 -4.9 -4.6 -8.8 0 -8.8 Z" fill="#F7F4EC"/>
        <g clip-path="url(#ec)">
          <circle r="7.7" fill="url(#iris)" stroke="#53D9FF" stroke-opacity=".55" stroke-width="1"/>
          <circle r="3.5" fill="#08111A"/>
          <circle cx="2.8" cy="-3.1" r="2.5" fill="#FFFFFF" opacity=".95"/>
        </g>
        <g clip-path="url(#ec)"><rect x="-9.4" y="-9.8" width="18.8" height="1.5" fill="#141824"/></g>
      </g>

      <path fill="#10131C" d="M60 88.4 C64.6 88.4 68.4 90.5 68.4 93.5 C68.4 96.9 64.2 99.8 60 99.8 C55.8 99.8 51.6 96.9 51.6 93.5 C51.6 90.5 55.4 88.4 60 88.4 Z"/>
      <g fill="none" stroke="#10131C" stroke-width="2.4" stroke-linecap="round">
        <path d="M60 99.4 Q56.2 104 52.2 101.4"/>
        <path d="M60 99.4 Q63.8 104 67.8 101.4"/>
      </g>
    </g>
  </g>

  <path d="M168 414 C186 450 326 450 344 414" stroke="url(#tug)" stroke-width="15" stroke-linecap="round" fill="none"/>
</svg>
