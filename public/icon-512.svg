<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FNM">
  <title>FNM</title>
  <!--
    THE HEADING (512 / store listing only) — a dark iOS squircle containing three things on a diagonal:
    the dog, the line, the destination. That is the whole product in one tile:
    he reads, he commits, you arrive at food. Almost every icon in the category
    is a centred glyph; a diagonal is FINDABLE on a crowded home screen before
    it is identified.

    SINGLE BRIGHTEST PIXEL RULE: exactly one saturated ember focal point — the
    harness ring where the tugline attaches. The bowl is cream, the coat slate,
    the eyes cyan, the NOSE IS BLACK, the ground near-black. One focal accent,
    never a colour fight.

    The tile stays dark in both themes. The app icon is the one place FNM never
    inverts: a dark tile with a pale needle is the recognition anchor.
  -->
  <defs>
    <linearGradient id="tile" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#16131A"/>
      <stop offset="1" stop-color="#0B0A10"/>
    </linearGradient>
    <!-- the exact same light source as the app aurora, so the icon and the first
         frame of the app are continuous -->
    <radialGradient id="ember" cx=".22" cy=".16" r=".62">
      <stop offset="0" stop-color="#FF6A2A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/>
    </radialGradient>
    <!-- barely visible; it is the reason the tile reads as glass, not paint -->
    <radialGradient id="plum" cx=".84" cy=".88" r=".45">
      <stop offset="0" stop-color="#AE3EC9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#AE3EC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1=".22" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#6B7690"/>
      <stop offset=".52" stop-color="#454E63"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <linearGradient id="face" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE5EE"/>
    </linearGradient>
    <linearGradient id="cap" x1=".18" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#333C54"/>
      <stop offset=".62" stop-color="#232A3C"/>
      <stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <linearGradient id="blaze" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF2"/>
    </linearGradient>
    <linearGradient id="earin" x1=".5" y1="1" x2=".5" y2="0">
      <stop offset="0" stop-color="#F2A6A6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#F2A6A6"/>
    </linearGradient>
    <linearGradient id="rim" x1=".10" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#FFB03A" stop-opacity=".55"/>
      <stop offset=".30" stop-color="#FF7A45" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#53D9FF" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="tug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB03A"/>
      <stop offset="1" stop-color="#FF4D2E"/>
    </linearGradient>
    <clipPath id="hd">
      <path d="M60 28 C81 28 98 45 98 66 C98 87 81 104 60 104 C39 104 22 87 22 66 C22 45 39 28 60 28 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#ember)"/>
  <rect width="512" height="512" rx="114" fill="url(#plum)"/>

  <!-- SUBSTRATE: the taste-radar hexagon, R=210 centred 256/248, rotated so one
       spoke runs along the tugline diagonal. Invisible at 60px, a discoverable
       detail at 512. NEVER above 6% or it reads as noise. -->
  <g transform="rotate(2.6 256 248)" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1">
    <path d="M256 38 L437.9 143 L437.9 353 L256 458 L74.1 353 L74.1 143 Z"/>
  </g>

  <!-- sells that he sits IN the icon rather than on it -->
  <ellipse cx="256" cy="368" rx="76" ry="12" fill="#000000" opacity=".2"/>

  <!-- TOGO: wedge spanning 296px (58%), optical centre 224/214 — up and LEFT of
       geometric centre, because he is looking down the line and ear mass reads
       heavy. Mood LOCKED with a fractional squint: confident, not blank. -->
  <g transform="translate(256 222) scale(3.05) translate(-60 -62)">
    <!-- ears pinned forward 11°, hinging about their own bases -->
    <g transform="rotate(11 40 40)">
      <path d="M30 44 C26 32 29 20 34 15 C38 11 43 13 45 19 L51 38 C52.6 42.6 49 47 44.6 45.4 Z" fill="url(#coat)"/>
      <path d="M34.5 39 C32 31 33.5 23.5 36.5 20.5 C38.8 18.2 41.5 19.4 42.7 22.9 L46.3 34.3 C47.2 36.9 45.2 39.4 42.7 38.5 Z" fill="url(#earin)"/>
    </g>
    <g transform="scale(-1,1) translate(-120,0)">
      <g transform="rotate(11 40 40)">
        <path d="M30 44 C26 32 29 20 34 15 C38 11 43 13 45 19 L51 38 C52.6 42.6 49 47 44.6 45.4 Z" fill="url(#coat)"/>
        <path d="M34.5 39 C32 31 33.5 23.5 36.5 20.5 C38.8 18.2 41.5 19.4 42.7 22.9 L46.3 34.3 C47.2 36.9 45.2 39.4 42.7 38.5 Z" fill="url(#earin)"/>
      </g>
    </g>

    <g transform="rotate(3 60 100)">
      <path d="M60 28 C81 28 98 45 98 66 C98 87 81 104 60 104 C39 104 22 87 22 66 C22 45 39 28 60 28 Z" fill="url(#face)"/>
      <path d="M60 28 C81 28 98 45 98 66 C98 87 81 104 60 104 C39 104 22 87 22 66 C22 45 39 28 60 28 Z" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity=".5"/>
      <path clip-path="url(#hd)" fill="url(#cap)" d="M22.1 64 A38 38 0 0 1 97.9 64 C94 64 86 60 74 54 C68 50.4 64 48 60 48 C56 48 52 50.4 46 54 C34 60 26 64 22.1 64 Z"/>
      <path fill="url(#blaze)" d="M60 30 L70.4 48 C66 47.4 63 48.6 60 51 C57 48.6 54 47.4 49.6 48 Z"/>
      <g clip-path="url(#hd)" fill="#F28C8C" opacity=".4">
        <ellipse cx="35" cy="76" rx="8.4" ry="5.2"/>
        <ellipse cx="85" cy="76" rx="8.4" ry="5.2"/>
      </g>
      <g transform="translate(74 64)">
        <path d="M0 -6.2 C3 -6.2 5.4 -3.4 5.4 0 C5.4 3.4 3 6.2 0 6.2 C-3 6.2 -5.4 3.4 -5.4 0 C-5.4 -3.4 -3 -6.2 0 -6.2 Z" fill="#10131C"/>
        <circle cx="1.9" cy="-2.2" r="2" fill="#FFFFFF" opacity=".95"/>
        <circle cx="-1.6" cy="2.2" r=".9" fill="#FFFFFF" opacity=".4"/>
      </g>
      <g transform="translate(120,0) scale(-1,1) translate(74 64)">
        <path d="M0 -6.2 C3 -6.2 5.4 -3.4 5.4 0 C5.4 3.4 3 6.2 0 6.2 C-3 6.2 -5.4 3.4 -5.4 0 C-5.4 -3.4 -3 -6.2 0 -6.2 Z" fill="#10131C"/>
        <circle cx="1.9" cy="-2.2" r="2" fill="#FFFFFF" opacity=".95"/>
        <circle cx="-1.6" cy="2.2" r=".9" fill="#FFFFFF" opacity=".4"/>
      </g>
      <path fill="#10131C" d="M60 76 C63.4 76 66 77.6 66 80 C66 82.7 62.8 85 60 85 C57.2 85 54 82.7 54 80 C54 77.6 56.6 76 60 76 Z"/>
      <circle cx="57.2" cy="78.6" r="1.5" fill="#FFFFFF" opacity=".45"/>
      <g fill="none" stroke="#10131C" stroke-width="2.1" stroke-linecap="round">
        <path d="M60 85 Q55.8 90.6 51.2 87.6"/>
        <path d="M60 85 Q64.2 90.6 68.8 87.6"/>
      </g>
    </g>
  </g>

  <!-- THE DESTINATION, CENTRED UNDER HIM rather than out on a diagonal. The
       diagonal was authored for the tall wedge head of geometry revision 2; a
       round head cannot carry a line off its own jaw without the line reading
       as a straw from his mouth to the bowl, which is what it did. So the 512
       now runs the primary tile's composition at full detail: the ember arc
       under the chin, doing three jobs at once — bowl rim, horizon, and the
       line he is pulling — with the real BowlIcon nested inside it. -->
  <path d="M138 424 C164 480 348 480 374 424" stroke="url(#tug)" stroke-width="19" stroke-linecap="round" fill="none"/>
  <g transform="translate(256 430) scale(4.6) translate(-12 -12)">
    <path d="M4 12a8 8 0 0 0 16 0z" fill="url(#blaze)" fill-opacity=".92"/>
    <rect x="3.2" y="10.9" width="17.6" height="2.2" rx="1.1" fill="#F7F4EC"/>
    <path d="M9 8c0-1.5 1-1.5 1-3M13 8c0-1.5 1-1.5 1-3" fill="none" stroke="#F7F4EC" stroke-opacity=".5" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
