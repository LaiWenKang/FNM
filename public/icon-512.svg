<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FNM">
  <title>FNM</title>
  <!--
    THE HEADING (512 / store listing only) — a dark iOS squircle containing three things on a diagonal:
    the dog, the line, the destination. That is the whole product in one tile:
    he reads, he commits, you arrive at food. Almost every icon in the category
    is a centred glyph; a diagonal is FINDABLE on a crowded home screen before
    it is identified.

    SINGLE BRIGHTEST PIXEL RULE: exactly one saturated ember focal point — the
    harness ring where the tugline attaches. The bowl is cream, the coat slate,
    the eyes cyan, the NOSE IS BLACK, the ground near-black. One focal accent,
    never a colour fight.

    The tile stays dark in both themes. The app icon is the one place FNM never
    inverts: a dark tile with a pale needle is the recognition anchor.
  -->
  <defs>
    <linearGradient id="tile" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#16131A"/>
      <stop offset="1" stop-color="#0B0A10"/>
    </linearGradient>
    <!-- the exact same light source as the app aurora, so the icon and the first
         frame of the app are continuous -->
    <radialGradient id="ember" cx=".22" cy=".16" r=".62">
      <stop offset="0" stop-color="#FF6A2A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/>
    </radialGradient>
    <!-- barely visible; it is the reason the tile reads as glass, not paint -->
    <radialGradient id="plum" cx=".84" cy=".88" r=".45">
      <stop offset="0" stop-color="#AE3EC9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#AE3EC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1=".22" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#5A6478"/>
      <stop offset=".52" stop-color="#394152"/>
      <stop offset="1" stop-color="#1B1F2B"/>
    </linearGradient>
    <linearGradient id="blaze" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#F7F4EC"/>
      <stop offset=".62" stop-color="#F7F4EC"/>
      <stop offset="1" stop-color="#D2DAE6"/>
    </linearGradient>
    <radialGradient id="iris" cx=".40" cy=".32" r=".78">
      <stop offset="0" stop-color="#DFF7FF"/>
      <stop offset=".38" stop-color="#8FE9FF"/>
      <stop offset=".68" stop-color="#53D9FF"/>
      <stop offset="1" stop-color="#1B6C97"/>
    </radialGradient>
    <linearGradient id="earin" x1=".5" y1="1" x2=".5" y2="0">
      <stop offset="0" stop-color="#FF7A45" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F7F4EC" stop-opacity=".55"/>
    </linearGradient>
    <!-- ember falls top-left, cyan bounces back bottom-right: he is LIT BY the
         Ember Engine rather than painted in it -->
    <linearGradient id="rim" x1=".10" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#FFB03A" stop-opacity=".95"/>
      <stop offset=".36" stop-color="#FF7A45" stop-opacity=".34"/>
      <stop offset=".60" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#53D9FF" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="tug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB03A"/>
      <stop offset="1" stop-color="#FF4D2E"/>
    </linearGradient>
    <clipPath id="hd">
      <path d="M60 39.4 C64 37.6 66.6 36.6 68.5 36.2 C81 34.6 89.8 39.8 94.4 49.2 C97.4 55.4 98.4 62.4 98 69.8 C99.9 74.2 98.4 78.2 93.8 81 C95 85.8 93 89.2 88 91.2 C88.6 95.4 86 98.2 81 99.4 C79.6 100.6 78 101.2 76.6 101.6 C76.4 105.4 75.4 109 72.6 111.4 C69.6 114 65.2 115.2 60 115.4 C54.8 115.2 50.4 114 47.4 111.4 C44.6 109 43.6 105.4 43.4 101.6 C42 101.2 40.4 100.6 39 99.4 C34 98.2 31.4 95.4 32 91.2 C27 89.2 25 85.8 26.2 81 C21.6 78.2 20.1 74.2 22 69.8 C21.6 62.4 22.6 55.4 25.6 49.2 C30.2 39.8 39 34.6 51.5 36.2 C53.4 36.6 56 37.6 60 39.4 Z"/>
    </clipPath>
    <clipPath id="ec">
      <path d="M-9 0 C-6.4 -5.6 -1 -7.2 4.6 -5.2 C7.6 -4 9 -2 9 -1 C9 1.4 5.8 4.8 .8 5.4 C-4.2 6 -7 3.4 -9 0 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#ember)"/>
  <rect width="512" height="512" rx="114" fill="url(#plum)"/>

  <!-- SUBSTRATE: the taste-radar hexagon, R=210 centred 256/248, rotated so one
       spoke runs along the tugline diagonal. Invisible at 60px, a discoverable
       detail at 512. NEVER above 6% or it reads as noise. -->
  <g transform="rotate(2.6 256 248)" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1">
    <path d="M256 38 L437.9 143 L437.9 353 L256 458 L74.1 353 L74.1 143 Z"/>
  </g>

  <!-- sells that he sits IN the icon rather than on it -->
  <ellipse cx="214" cy="366" rx="84" ry="15" fill="#000000" opacity=".34"/>

  <!-- TOGO: wedge spanning 296px (58%), optical centre 224/214 — up and LEFT of
       geometric centre, because he is looking down the line and ear mass reads
       heavy. Mood LOCKED with a fractional squint: confident, not blank. -->
  <g transform="translate(214 206) scale(2.9) translate(-60 -62)">
    <!-- ears pinned forward 11°, hinging about their own bases -->
    <g transform="rotate(11 34.5 50.2)">
      <path d="M25.6 49.4 C23.4 38 25.6 23.4 29.8 13.2 C31.8 8.2 37.6 8 39.6 13.2 L51.5 41 C53.3 44.8 50.4 49.2 46.1 48.1 Z" fill="url(#coat)"/>
      <path d="M31 42.2 C29.8 36 31 28.1 33.2 22.6 C34.3 19.9 37.4 19.8 38.5 22.6 L45 37.6 C45.9 39.7 44.4 42.1 42 41.5 Z" fill="url(#earin)"/>
    </g>
    <g transform="scale(-1,1) translate(-120,0)">
      <g transform="rotate(11 34.5 50.2)">
        <path d="M25.6 49.4 C23.4 38 25.6 23.4 29.8 13.2 C31.8 8.2 37.6 8 39.6 13.2 L51.5 41 C53.3 44.8 50.4 49.2 46.1 48.1 Z" fill="url(#coat)"/>
        <path d="M31 42.2 C29.8 36 31 28.1 33.2 22.6 C34.3 19.9 37.4 19.8 38.5 22.6 L45 37.6 C45.9 39.7 44.4 42.1 42 41.5 Z" fill="url(#earin)"/>
      </g>
    </g>

    <g transform="rotate(5 60 110)">
      <path d="M60 39.4 C64 37.6 66.6 36.6 68.5 36.2 C81 34.6 89.8 39.8 94.4 49.2 C97.4 55.4 98.4 62.4 98 69.8 C99.9 74.2 98.4 78.2 93.8 81 C95 85.8 93 89.2 88 91.2 C88.6 95.4 86 98.2 81 99.4 C79.6 100.6 78 101.2 76.6 101.6 C76.4 105.4 75.4 109 72.6 111.4 C69.6 114 65.2 115.2 60 115.4 C54.8 115.2 50.4 114 47.4 111.4 C44.6 109 43.6 105.4 43.4 101.6 C42 101.2 40.4 100.6 39 99.4 C34 98.2 31.4 95.4 32 91.2 C27 89.2 25 85.8 26.2 81 C21.6 78.2 20.1 74.2 22 69.8 C21.6 62.4 22.6 55.4 25.6 49.2 C30.2 39.8 39 34.6 51.5 36.2 C53.4 36.6 56 37.6 60 39.4 Z" fill="url(#coat)"/>
      <path d="M60 39.4 C64 37.6 66.6 36.6 68.5 36.2 C81 34.6 89.8 39.8 94.4 49.2 C97.4 55.4 98.4 62.4 98 69.8 C99.9 74.2 98.4 78.2 93.8 81 C95 85.8 93 89.2 88 91.2 C88.6 95.4 86 98.2 81 99.4 C79.6 100.6 78 101.2 76.6 101.6 C76.4 105.4 75.4 109 72.6 111.4 C69.6 114 65.2 115.2 60 115.4 C54.8 115.2 50.4 114 47.4 111.4 C44.6 109 43.6 105.4 43.4 101.6 C42 101.2 40.4 100.6 39 99.4 C34 98.2 31.4 95.4 32 91.2 C27 89.2 25 85.8 26.2 81 C21.6 78.2 20.1 74.2 22 69.8 C21.6 62.4 22.6 55.4 25.6 49.2 C30.2 39.8 39 34.6 51.5 36.2 C53.4 36.6 56 37.6 60 39.4 Z" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
      <path clip-path="url(#hd)" fill="#141824" d="M12 24 L108 24 L108 74 C99 84.5 90 88 79 86.6 C70 85.4 64 82.6 60 80 C56 82.6 50 85.4 41 86.6 C30 88 21 84.5 12 74 Z"/>
      <path fill="url(#blaze)" d="M60 41 L72.7 63 C69.6 63.5 67.2 65 66.2 68.4 C65.4 71.4 65 74 65.2 78 C65.6 83.4 72.4 87.4 72.8 95 C73.2 103.6 68 110.6 60 111 C52 110.6 46.8 103.6 47.2 95 C47.6 87.4 54.4 83.4 54.8 78 C55 74 54.6 71.4 53.8 68.4 C52.8 65 50.4 63.5 47.3 63 Z"/>

      <g transform="rotate(-8 77 76) translate(77 76)">
        <path d="M-9 0 C-6.4 -5.6 -1 -7.2 4.6 -5.2 C7.6 -4 9 -2 9 -1 C9 1.4 5.8 4.8 .8 5.4 C-4.2 6 -7 3.4 -9 0 Z" fill="#F7F4EC"/>
        <g clip-path="url(#ec)">
          <circle r="6" fill="url(#iris)" stroke="#53D9FF" stroke-opacity=".55" stroke-width="1"/>
          <circle r="3" fill="#08111A"/>
          <circle cx="2.6" cy="-2.8" r="2.2" fill="#FFFFFF" opacity=".95"/>
          <circle cx="-2.1" cy="2.4" r="1" fill="#FFFFFF" opacity=".38"/>
        </g>
        <g clip-path="url(#ec)"><rect x="-10" y="-9.5" width="20" height="1.32" fill="#141824"/></g>
      </g>
      <g transform="translate(120,0) scale(-1,1) rotate(-8 77 76) translate(77 76)">
        <path d="M-9 0 C-6.4 -5.6 -1 -7.2 4.6 -5.2 C7.6 -4 9 -2 9 -1 C9 1.4 5.8 4.8 .8 5.4 C-4.2 6 -7 3.4 -9 0 Z" fill="#F7F4EC"/>
        <g clip-path="url(#ec)">
          <circle r="6" fill="url(#iris)" stroke="#53D9FF" stroke-opacity=".55" stroke-width="1"/>
          <circle r="3" fill="#08111A"/>
          <circle cx="2.6" cy="-2.8" r="2.2" fill="#FFFFFF" opacity=".95"/>
          <circle cx="-2.1" cy="2.4" r="1" fill="#FFFFFF" opacity=".38"/>
        </g>
        <g clip-path="url(#ec)"><rect x="-10" y="-9.5" width="20" height="1.32" fill="#141824"/></g>
      </g>

      <path fill="#10131C" d="M60 93 C64.2 93 68 94.8 68 97.5 C68 100.6 63.6 103.2 60 103.2 C56.4 103.2 52 100.6 52 97.5 C52 94.8 55.8 93 60 93 Z"/>
      <circle cx="57" cy="95" r="1.6" fill="#FFFFFF" opacity=".5"/>
      <g fill="none" stroke="#10131C" stroke-width="2.4" stroke-linecap="round">
        <path d="M60 103.7 Q54.8 108.4 49 105.6"/>
        <path d="M60 103.7 Q65.2 108.4 71 105.6"/>
      </g>
    </g>

    <!-- 4 of 6 whiskers: indices 1 and 4, the horizontal pair, run into the tile
         edge and alias worst -->
    <g fill="none" stroke="#EBEBF5" stroke-opacity=".2" stroke-width="1.5" stroke-linecap="round">
      <path d="M47 95 C41 92.6 36 90 31.6 86.4"/>
      <path d="M47 103.6 C41.4 105.6 36.6 108 32.6 111"/>
      <path d="M73 95 C79 92.6 84 90 88.4 86.4"/>
      <path d="M73 103.6 C78.6 105.6 83.4 108 87.4 111"/>
    </g>
  </g>

  <!-- HARNESS webbing running down his shoulder, hugging the head's right edge —
       never across the face, because a strap over the muzzle reads as a pipe
       through his head — then THE RING, the single saturated ember mass in the
       tile, and the only place ember appears on the animal at all. -->
  <path d="M352 304 C372 322 390 338 410 354" stroke="url(#tug)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <rect x="335" y="286" width="30" height="30" rx="5" transform="rotate(45 350 301)" fill="#FF7A45"/>
  <rect x="343" y="294" width="14" height="14" rx="3" transform="rotate(45 350 301)" fill="#FFC98A"/>

  <!-- THE DESTINATION: the shipped BowlIcon path where the tugline lands, with
       its rim as a separate capsule so it reads as a bowl rather than a disc,
       and two steam curls reusing BowlIcon's own second-path grammar. Mascot and
       existing glyph are provably one system. -->
  <g transform="translate(432 394) scale(5.4) translate(-12 -12)">
    <path d="M4 12a8 8 0 0 0 16 0z" fill="url(#blaze)" fill-opacity=".92"/>
    <rect x="3.2" y="10.9" width="17.6" height="2.2" rx="1.1" fill="#F7F4EC"/>
    <path d="M9 8c0-1.5 1-1.5 1-3M13 8c0-1.5 1-1.5 1-3" fill="none" stroke="#F7F4EC" stroke-opacity=".5" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
