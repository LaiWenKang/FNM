<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FNM">
  <title>FNM</title>
  <!--
    THE ICON, REBUILT AROUND WHY THE LAST ONE FAILED.

    Rendered beside real home-screen neighbours the old tile read as a HOLE in
    the row: a dark square with a small pale motif floating in the middle, while
    every icon around it committed to a bold colour field with one large shape.
    By 29px it was mush and the loose ember arc under the chin read as a smudge.

    Three changes, each answering one of those:
      COMMIT TO A COLOUR   Ember, the brand's own accent, and the one hue that
                           reads as FOOD next to the blues and greens.
      FILL THE TILE        The head spans ~74% edge to edge. The neighbours all
                           do; the old one managed 45%.
      FOUR MARKS TOTAL     Cap, two eyes, nose, smile. Everything that could not
                           survive 29px is gone.

    The blaze is KNOCKED OUT back to the ember field rather than painted, so one
    shape is simultaneously a husky's blaze and FNM's own 60° needle.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#FFA23D"/><stop offset=".55" stop-color="#FF6A2A"/><stop offset="1" stop-color="#F0341F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 268) scale(4.35) translate(-60 -66)">
    <!-- ONE cream silhouette: ears and head as a single mass. -->
    <path fill="#FFF6EC" d="M30 44 C26 32 29 20 34 15 C38 11 43 13 45 19 L51 38 Z"/>
    <path fill="#FFF6EC" d="M90 44 C94 32 91 20 86 15 C82 11 77 13 75 19 L69 38 Z"/>
    <circle cx="60" cy="66" r="38" fill="#FFF6EC"/>
    <!-- INNER EARS. Without them the cream triangles read as a rabbit; this is
         the one mark that makes the species unambiguous at 26px. -->
    <path fill="#E0563A" d="M34.5 39 C32 31 33.5 23.5 36.5 20.5 C38.8 18.2 41.5 19.4 42.7 22.9 L46.3 34.3 Z"/>
    <path fill="#E0563A" d="M85.5 39 C88 31 86.5 23.5 83.5 20.5 C81.2 18.2 78.5 19.4 77.3 22.9 L73.7 34.3 Z"/>
    <!-- THREE DARK MARKS AND NOTHING ELSE: cap, eyes, nose. -->
    <g fill="#20141B">
      <path d="M22.1 64 A38 38 0 0 1 97.9 64 C94 64 86 60 74 54 C68 50.4 64 48 60 48 C56 48 52 50.4 46 54 C34 60 26 64 22.1 64 Z"/>
      <ellipse cx="46" cy="64" rx="5.6" ry="6.4"/><ellipse cx="74" cy="64" rx="5.6" ry="6.4"/>
      <path d="M60 76 C63.8 76 66.6 77.8 66.6 80.4 C66.6 83.3 63 85.6 60 85.6 C57 85.6 53.4 83.3 53.4 80.4 C53.4 77.8 56.2 76 60 76 Z"/>
    </g>
    <g fill="none" stroke="#20141B" stroke-width="2.6" stroke-linecap="round">
      <path d="M60 85.6 Q55.4 91.6 50.4 88.2"/><path d="M60 85.6 Q64.6 91.6 69.6 88.2"/>
    </g>
    <!-- THE BLAZE, KNOCKED BACK OUT TO THE EMBER FIELD. One shape doing two
         jobs: a husky's blaze, and FNM's own 60° needle. -->
    <path fill="url(#bg)" d="M60 30 L70.4 48 C66 47.4 63 48.6 60 51 C57 48.6 54 47.4 49.6 48 Z"/>
  </g>
</svg>
